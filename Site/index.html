<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previsão do tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pagina">
  <h1>Previsão dos próximos 7 dias</h1>
  <form class="busca" id="busca">
    <label for="cidade" class="oculto">Cidade</label>
    <div class="busca__campo">
      <input id="cidade" name="cidade" type="text" autocomplete="off" placeholder="Digite o nome da cidade" required>
      <button type="submit">Consultar</button>
    </div>
  </form>
  <p class="aviso" id="aviso" role="status" aria-live="polite">Digite uma cidade para ver a previsão.</p>
  <section class="clima" id="clima" data-tema="sol" hidden></section>
</main>
<script src="app.js"></script>
</body>
</html>
